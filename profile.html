<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Lumière Beauty Studio</title>
  <meta name="description" content="Manage your Lumière profile — personal details, preferences and beauty notes.">
  <link rel="icon" type="image/webp" href="assets/images/stackly-whitish_blue-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/services.css">
  <link rel="stylesheet" href="assets/css/stylists.css">
  <link rel="stylesheet" href="assets/css/salons.css">
  <link rel="stylesheet" href="assets/css/booking.css">
  <link rel="stylesheet" href="assets/css/calendar.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/neomorphism.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="dash">
    <aside class="dash-side" id="dash-side" aria-label="Dashboard navigation"></aside>
    <div class="dash-main">
      <div class="dash-top" id="dash-top"></div>
      <div class="dash-body">
        <div class="dash-grid dash-grid--1-2">

          <!-- identity card -->
          <div style="display:grid;gap:16px;align-content:start">
            <div class="panel" data-reveal="up">
              <div class="panel__body text-center">
                <div class="avatar-upload__preview mx-auto mb-4" id="pf-avatar" style="width:120px;height:120px">
                  <i data-icon="user"></i>
                  <label class="avatar-upload__cam" for="pf-photo" aria-label="Change photo"><i data-icon="camera"></i></label>
                </div>
                <input type="file" id="pf-photo" accept="image/*" data-img-preview="#pf-avatar" hidden>
                <h2 id="pf-name" style="font-size:var(--fs-xl)">—</h2>
                <p class="text-muted text-sm mb-3" id="pf-email">—</p>
                <span class="loyalty-tier" style="background:var(--light-pink);border-color:transparent;color:var(--deep-rose)"><i data-icon="crown"></i><span id="pf-tier">Gold</span> Member</span>
                <hr class="rule mt-5 mb-5">
                <div class="stat-row" style="grid-template-columns:repeat(3,1fr)">
                  <div class="stat" style="padding:8px"><div class="stat__num" style="font-size:1.6rem" id="pf-visits">6</div><div class="stat__label" style="font-size:10px">Visits</div></div>
                  <div class="stat" style="padding:8px"><div class="stat__num" style="font-size:1.6rem" id="pf-points">0</div><div class="stat__label" style="font-size:10px">Points</div></div>
                  <div class="stat" style="padding:8px"><div class="stat__num" style="font-size:1.6rem" id="pf-favs">0</div><div class="stat__label" style="font-size:10px">Favourites</div></div>
                </div>
              </div>
            </div>

            <div class="panel" data-reveal="up">
              <div class="panel__head"><h3><i data-icon="sparkles"></i>Beauty profile</h3></div>
              <div class="panel__body">
                <div class="form-grid">
                  <label class="field has-label"><span class="field__label">Hair type</span>
                    <select class="select" id="pf-hair">
                      <option>Straight</option><option selected>Wavy</option><option>Curly</option><option>Coily</option>
                    </select></label>
                  <label class="field has-label"><span class="field__label">Skin type</span>
                    <select class="select" id="pf-skin">
                      <option>Normal</option><option selected>Combination</option><option>Dry</option><option>Oily</option><option>Sensitive</option>
                    </select></label>
                  <label class="field has-label"><span class="field__label">Allergies / sensitivities</span>
                    <input class="input" id="pf-allergy" placeholder="e.g. ammonia, fragrance…"></label>
                </div>
                <p class="field__hint mt-3">Shared with your stylist before every appointment, so you never repeat yourself.</p>
              </div>
            </div>
          </div>

          <!-- edit form -->
          <div class="panel" data-reveal="up">
            <div class="panel__head">
              <h3><i data-icon="edit"></i>Personal details</h3>
              <span class="badge badge--mint badge--dot" id="pf-saved-badge" style="display:none">Saved</span>
            </div>
            <div class="panel__body">
              <form id="pf-form" novalidate>
                <div class="form-grid form-grid--2">
                  <label class="field field--icon has-label"><span class="field__label">Full Name <span class="req">*</span></span>
                    <input class="input" id="pf-f-name" data-rules="required|name" autocomplete="name">
                    <span class="field__icon"><i data-icon="user"></i></span></label>
                  <label class="field field--icon has-label"><span class="field__label">Email <span class="req">*</span></span>
                    <input class="input" type="email" id="pf-f-email" data-rules="required|email" autocomplete="email">
                    <span class="field__icon"><i data-icon="mail"></i></span></label>
                  <label class="field field--icon has-label"><span class="field__label">Phone</span>
                    <input class="input" type="tel" id="pf-f-phone" data-rules="phone" placeholder="+91 98765 43210" autocomplete="tel">
                    <span class="field__icon"><i data-icon="phone"></i></span></label>
                  <label class="field has-label"><span class="field__label">Birthday <small class="text-faint">(free service every year!)</small></span>
                    <input class="input" type="date" id="pf-f-dob"></label>
                  <label class="field has-label"><span class="field__label">City</span>
                    <select class="select" id="pf-f-city"></select></label>
                  <label class="field has-label"><span class="field__label">Preferred salon</span>
                    <select class="select" id="pf-f-salon"></select></label>
                  <label class="field form-row-full has-label"><span class="field__label">About you <small class="text-faint">(optional)</small></span>
                    <textarea class="textarea" id="pf-f-bio" data-rules="max:280" placeholder="Anything your stylists should know — style preferences, past experiences, pet peeves…"></textarea></label>
                </div>
                <div class="flex-between flex-wrap mt-6">
                  <button type="button" class="btn btn--ghost" id="pf-reset"><i data-icon="refresh"></i>Discard Changes</button>
                  <button class="btn btn--primary btn--lg" type="submit" id="pf-save"><i data-icon="save"></i>Save Profile</button>
                </div>
              </form>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/images.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/appointment.js"></script>
  <script src="assets/js/darkmode.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/filter.js"></script>
  <script src="assets/js/gallery.js"></script>
  <script src="assets/js/slider.js"></script>
  <script src="assets/js/animation.js"></script>
  <script src="assets/js/calendar.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    window.pageInit = function () {
      var user = Dash.mount({ role: 'client', active: 'profile', title: 'My Profile', sub: 'Who you are, beautifully organised' });

      function fill() {
        document.getElementById('pf-name').textContent = user.name;
        document.getElementById('pf-email').textContent = user.email;
        document.getElementById('pf-tier').textContent = user.tier || 'Gold';
        document.getElementById('pf-f-name').value = user.name;
        document.getElementById('pf-f-email').value = user.email;
        document.getElementById('pf-f-phone').value = user.phone || '';
        document.getElementById('pf-f-dob').value = user.dob || '';
        document.getElementById('pf-f-bio').value = user.bio || '';
      }

      var pfPoints = document.getElementById('pf-points');
      pfPoints.dataset.count = Store.getPoints();
      App.animateCounter(pfPoints);
      var wl = Wishlist.counts();
      var pfFavs = document.getElementById('pf-favs');
      pfFavs.dataset.count = wl.services + wl.salons + wl.stylists;
      App.animateCounter(pfFavs);
      var visits = Store.getAppointments().filter(function (a) { return a.status === 'completed'; }).length;
      var pfVisits = document.getElementById('pf-visits');
      pfVisits.dataset.count = visits;
      App.animateCounter(pfVisits);

      document.getElementById('pf-f-city').innerHTML = DATA.CITIES.map(function (c, i) {
        return '<option' + ((user.city || 'Mumbai') === c ? ' selected' : '') + '>' + c + '</option>';
      }).join('');
      document.getElementById('pf-f-salon').innerHTML = DATA.SALONS.map(function (s) {
        return '<option value="' + s.slug + '"' + ((user.prefSalon || 'lumiere-bandra') === s.slug ? ' selected' : '') + '>' + s.name + '</option>';
      }).join('');
      fill();

      document.getElementById('pf-form').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!Validate.form(this)) {
          Toast.error('A couple of fields need fixing first.');
          return;
        }
        var btn = document.getElementById('pf-save');
        btn.classList.add('is-loading');
        setTimeout(function () {
          btn.classList.remove('is-loading');
          user = Store.updateUser({
            name: document.getElementById('pf-f-name').value.trim(),
            email: document.getElementById('pf-f-email').value.trim(),
            phone: document.getElementById('pf-f-phone').value.trim(),
            dob: document.getElementById('pf-f-dob').value,
            city: document.getElementById('pf-f-city').value,
            prefSalon: document.getElementById('pf-f-salon').value,
            bio: document.getElementById('pf-f-bio').value.trim()
          });
          fill();
          var badge = document.getElementById('pf-saved-badge');
          badge.style.display = '';
          setTimeout(function () { badge.style.display = 'none'; }, 3000);
          Toast.success('Profile saved. Looking sharp!', 'All set ✨');
        }, 800);
      });

      document.getElementById('pf-reset').addEventListener('click', function () {
        fill();
        Toast.info('Changes discarded — back to your saved profile.');
      });

      ['pf-hair', 'pf-skin'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', function () {
          Toast.success('Beauty profile updated — your stylists will see this.', 'Noted');
        });
      });
    };
  </script>
</body>
</html>
